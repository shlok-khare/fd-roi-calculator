    <!-- Superleap analytics — drop snippet here -->
    <!-- iframe auto-resize: posts document height to parent page -->
    <script>
      (function () {
        function postHeight() {
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: 'rzp-roi-calc-height', height: document.documentElement.scrollHeight },
              '*'
            );
          }
        }
        // Fire on load + whenever DOM changes
        window.addEventListener('load', postHeight);
        const ro = new ResizeObserver(postHeight);
        ro.observe(document.documentElement);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
